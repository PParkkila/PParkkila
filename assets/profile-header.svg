<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">Patrik Parkkila</title>
  <desc id="description">Computer Science, Applied Mathematics, AI and Data</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="0.55" stop-color="#102C46" />
      <stop offset="1" stop-color="#0B5960" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" />
      <stop offset="1" stop-color="#5EEAD4" />
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#A7F3D0" stroke-opacity="0.075" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#background)" />
  <rect width="1280" height="320" rx="24" fill="url(#grid)" />

  <circle cx="1110" cy="80" r="150" fill="#2DD4BF" fill-opacity="0.13" filter="url(#softGlow)" />
  <circle cx="1190" cy="280" r="120" fill="#22D3EE" fill-opacity="0.11" filter="url(#softGlow)" />

  <g transform="translate(92 70)">
    <rect x="0" y="0" width="78" height="6" rx="3" fill="url(#accent)" />
    <text x="0" y="82" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">
      Patrik Parkkila
    </text>
    <text x="2" y="132" fill="#C7D8E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500" letter-spacing="2.2">
      COMPUTER SCIENCE · APPLIED MATHEMATICS
    </text>
    <text x="2" y="174" fill="#5EEAD4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" letter-spacing="3">
      AI  /  DATA  /  COMPUTATIONAL SYSTEMS
    </text>
  </g>

</svg>
